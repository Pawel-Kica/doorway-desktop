# XcodeGen spec for Doorway.xcodeproj. After editing, run `xcodegen` in app/ios and commit the regenerated project.
name: Doorway
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
# Team ID and bundle ID prefix come from Signing.xcconfig and your gitignored Local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Doorway:
    type: application
    platform: iOS
    # Core is compiled straight into the app, no package dependency.
    sources:
      - App
      - Core
    settings:
      base:
        PRODUCT_NAME: Doorway
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).doorway.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Doorway
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DoorwayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Doorway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).doorway.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Doorway:
    build:
      targets:
        Doorway: all
        DoorwayUITests: [test]
    test:
      targets:
        - DoorwayUITests
